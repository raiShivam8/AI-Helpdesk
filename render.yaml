# ==============================================================================
# Render Blueprint Configuration for AI Helpdesk
# Deploy Web Service, Background Worker, Cron Job, and PostgreSQL Database on Render
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Web Service (Laravel Web Application + Nginx + PHP-FPM)
  # ----------------------------------------------------------------------------
  - type: web
    name: ai-helpdesk-web
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "AI Helpdesk"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: "https://ai-helpdesk-36ef.onrender.com"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: ai-helpdesk-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_NAME
        value: "AI Helpdesk"
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: IMAP_HOST
        value: imap.gmail.com
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_ENCRYPTION
        value: ssl
      - key: IMAP_PROTOCOL
        value: imap
      - key: IMAP_USERNAME
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: IMAP_VALIDATE_CERT
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # ----------------------------------------------------------------------------
  # 2. Background Worker Service (Laravel Queue Worker)
  # ----------------------------------------------------------------------------
  - type: worker
    name: ai-helpdesk-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: worker
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "AI Helpdesk"
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: "https://ai-helpdesk-36ef.onrender.com"
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: ai-helpdesk-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # ----------------------------------------------------------------------------
  # 3. Cron Job (IMAP Customer Email Polling every 1 minute)
  # ----------------------------------------------------------------------------
  - type: cron
    name: ai-helpdesk-fetch-emails
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: cron
    schedule: "* * * * *"
    envVars:
      - key: APP_NAME
        value: "AI Helpdesk"
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: ai-helpdesk-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: IMAP_HOST
        value: imap.gmail.com
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_ENCRYPTION
        value: ssl
      - key: IMAP_USERNAME
        sync: false
      - key: IMAP_PASSWORD
        sync: false

databases:
  # ----------------------------------------------------------------------------
  # 4. Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: ai-helpdesk-db
    databaseName: helpdesk
    user: helpdesk_user
    plan: free
